services:
  libretranslate:
    image: docker.io/libretranslate/libretranslate:v1.9.6
    container_name: ${STACK_NAME}-libretranslate
    restart: unless-stopped
    profiles:
      - translate
      - owui
    environment:
      LT_API_KEYS: "false"
      LT_DISABLE_WEB_UI: "false"
      LT_LOAD_ONLY: en,ja
      LT_UPDATE_MODELS: "false"
      LT_FORCE_UPDATE_MODELS: "false"
    # model不足時のonline fallbackを防ぎ、不完全な閉域資材は起動前に検出する。
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test -f /home/libretranslate/.local/share/argos-translate/packages/en_ja/metadata.json
        test -f /home/libretranslate/.local/share/argos-translate/packages/ja_en/metadata.json
        test -f /home/libretranslate/.local/share/argos-translate/minisbd/en.onnx
        test -f /home/libretranslate/.local/share/argos-translate/minisbd/ja.onnx
        exec ./scripts/entrypoint.sh
    ports:
      - "31300:5000"
    volumes:
      - /srv/libretranslate:/home/libretranslate/.local/share/argos-translate:ro
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - ./venv/bin/python scripts/healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    mem_limit: 4g
    memswap_limit: 5g
    pids_limit: 512
    labels:
      - homepage.group=13-translate
      - homepage.name=LibreTranslate
      - homepage.href=http://${PUBLIC_HOST}:31300
      - homepage.description=Machine translation API
      - homepage.icon=/icons/libretranslate.png

networks:
  internal-nw:
