services:
  libretranslate:
    image: docker.io/libretranslate/libretranslate:v1.9.6
    container_name: ${STACK_NAME}-libretranslate
    restart: unless-stopped
    profiles:
      - translate
      - owui
    environment:
      LT_API_KEYS: "false"
      LT_DISABLE_WEB_UI: "true"
      LT_LOAD_ONLY: ${LIBRETRANSLATE_LOAD_ONLY:-en,ja}
      LT_UPDATE_MODELS: "true"
    ports:
      - "31300:5000"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - ./venv/bin/python scripts/healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    mem_limit: 4g
    memswap_limit: 5g
    pids_limit: 512
    labels:
      - homepage.group=13-translate
      - homepage.name=LibreTranslate
      - homepage.href=http://${PUBLIC_HOST}:31300/docs
      - homepage.description=Machine translation API
      - homepage.icon=/icons/libretranslate.png

volumes:
  libretranslate-models:

networks:
  internal-nw:
