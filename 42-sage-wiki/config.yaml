version: 1
project: inferlab
description: InferLab Sage Wiki
language: Japanese

sources:
  - path: sources
    watch: true
output: wiki

ignore:
  - .sage
  - wiki

api:
  provider: openai-compatible
  api_key: ${LITELLM_MASTER_KEY}
  base_url: http://litellm:4000/v1
  extra_params:
    reasoning_effort: low

models:
  summarize: openai/gpt-oss:20b
  extract: google/gemma4:31b
  write: google/gemma4:31b
  lint: openai/gpt-oss:20b
  query: openai/gpt-oss:20b

embed:
  provider: openai
  model: Qwen/Qwen3-Embedding:0.6B
  api_key: ${LITELLM_MASTER_KEY}
  base_url: http://litellm:4000/v1

compiler:
  max_parallel: 2
  debounce_seconds: 2
  summary_max_tokens: 4000
  article_max_tokens: 8192
  extract_max_tokens: 16384
  extract_batch_size: 1
  auto_commit: true
  auto_lint: true
  timezone: Asia/Tokyo

limits:
  provider_timeout: 1800s

search:
  hybrid_weight_bm25: 0.7
  hybrid_weight_vector: 0.3
  default_limit: 10

serve:
  transport: stdio
  port: 3333
  worker:
    enabled: true

ontology:
  triples:
    enabled: true
    model: google/gemma4:31b
    max_tokens: 16384
