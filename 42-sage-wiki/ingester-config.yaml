version: 1

project:
  root: /wiki

scheduler:
  timezone: Asia/Tokyo

defaults:
  ingest:
    enabled: false
    run_on_start: false
    schedule: "0 * * * *"
    timeout_seconds: 600

sources:
  - id: obsidian-couchdb
    adapter: couchdb
    url: http://couchdb:5984
    database: obsidian
    username_env: COUCHDB_USERNAME
    password_env: COUCHDB_PASSWORD
    title_strategy: hierarchy
    exclude_path_prefixes:
      - "ix:"
    max_documents: 1000
    ingest:
      enabled: true
      run_on_start: true
      schedule: "0 */6 * * *"
