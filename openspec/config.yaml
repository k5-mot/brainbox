schema: spec-driven

context: |
  InferLabはDocker Composeで構成する閉域対応のAIサービス群です。
  事前取得scriptはPowerShellで実行し、Docker commandに依存せず、OutputDirに閉域持ち込み資材を作成します。
  user profileが容量制限付きnetwork driveである環境を考慮します。
  コードと文書はAGENTS.mdとdocs/rules配下のルールに従います。

rules:
  specs:
    - 要件とscenarioは日本語で記載する
    - 実装対象のscript名と観測可能な期待結果を明記する
    - Docker Compose profileごとにprofile-<profile>という1つのspecを作成する
    - profile横断要件はshared-platform specだけに記載する
    - 内部実装詳細はADRまたは既存READMEを参照し、specへ重複記載しない
  tasks:
    - 実装、自動検証、実downloadによるsmoke testを分けて記載する

operations:
  apply:
    guidance:
      - user profileの容量制限に影響するcacheと一時fileの保存先を検証する
  archive:
    guidance:
      - 現行specと実装の一致をstrict validationで確認する
