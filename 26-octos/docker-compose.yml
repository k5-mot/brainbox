services:
  octos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OCTOS_VERSION: v2.0.2
    image: localhost/inferlab/octos:v2.0.2
    container_name: ${STACK_NAME}-octos
    restart: unless-stopped
    profiles:
      - octos
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "50080"
      - --cwd
      - /workspace
      - --data-dir
      - /var/lib/octos
      - --provider
      - openai
      - --model
      - ${OCTOS_MODEL:-google/gemma4:31b}
    environment:
      HOME: /home/octos
      OCTOS_HOME: /var/lib/octos
      OCTOS_CONFIG_DIR: /var/lib/octos/config
      OCTOS_BOOTSTRAP_AUTH_TOKEN: ${OCTOS_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      TZ: Asia/Tokyo
    ports:
      - 32600:50080
    volumes:
      - octos-data:/var/lib/octos
      - octos-workspace:/workspace
    networks:
      - internal-nw
    # depends_on:
    #   litellm:
    #     condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:50080/health >/dev/null
          && curl -fsS -H "Authorization: Bearer $${OPENAI_API_KEY}"
          http://litellm:4000/v1/models >/dev/null
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 4g
    memswap_limit: 5g
    pids_limit: 2048
    labels:
      - homepage.group=26-octos
      - homepage.name=Octos
      - homepage.href=http://${PUBLIC_HOST}:32600/app/
      - homepage.description=Self-hosted AI agent workspace

volumes:
  octos-data:
  octos-workspace:

networks:
  internal-nw:
