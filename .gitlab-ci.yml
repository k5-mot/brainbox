stages:
  - verify
  - deploy

default:
  image: node:24.20.0-alpine3.24
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.18.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

docs:verify:
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pnpm docs:validate

docs:pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pnpm exec openspec validate --all --strict --no-interactive
    - DOCUSAURUS_SITE_URL="$CI_PAGES_URL" pnpm docs:build
  pages:
    publish: docs-site/build
