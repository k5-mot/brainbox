services:
  aion:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AION_VERSION: 2.2.1
        AION_COMMIT: dc47f4a0173ff506b08f13c97b10944d61e422d5
    image: localhost/inferlab/aion:2.2.1
    container_name: ${STACK_NAME}-aion
    restart: unless-stopped
    profiles:
      - aion
    environment:
      AIONUI_ALLOW_REMOTE: "true"
      AIONUI_DATA_DIR: /data
      AIONUI_LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      AIONUI_LITELLM_BASE_URL: http://litellm:4000/v1
      AIONUI_LITELLM_MODEL: ${AION_MODEL:-google/gemma4:31b}
      AIONUI_LOG_DIR: /data/logs
      AIONUI_PORT: "3000"
      TZ: Asia/Tokyo
    ports:
      - 32700:3000
    volumes:
      - aion-data:/data
      - aion-workspace:/data/workspace
    networks:
      - internal-nw
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          && curl -fsS http://127.0.0.1:3000/api/providers
          | jq -e '.data[] | select(.id == "inferlab-litellm")' >/dev/null
          && curl -fsS -H "Authorization: Bearer $${AIONUI_LITELLM_API_KEY}"
          http://litellm:4000/v1/models >/dev/null
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 4g
    memswap_limit: 5g
    pids_limit: 2048
    labels:
      - homepage.group=27-aion
      - homepage.name=AionUi
      - homepage.href=http://${PUBLIC_HOST}:32700/
      - homepage.description=Self-hosted Cowork and AI agent WebUI

volumes:
  aion-data:
  aion-workspace:

networks:
  internal-nw:
